<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora IMC</title>
    <link rel="stylesheet" href="style.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <main>
        <h1>Calculadora de IMC</h1>
        <section>
            <h2>Cadastro de informações</h2>
            <form id="form-imc">

                 <div class="campo-form">
                    <label for="nome">Informe seu Nome:</label>
                    <input type="text" id="nome"  placeholder="Maria José" required>
                </div>
                <div class="campo-form">
                    <label for="peso">Peso (kg):</label>
                    <input type="number" id="peso" step="0.1" placeholder="Ex: 75.5" required>
                </div>
                <div class="campo-form">
                    <label for="altura">Altura (m):</label>
                    <input type="number" id="altura" step="0.01" placeholder="Ex: 1.75" required>
                </div>

             <button type="submit">Calcular</button>
             <button type="reset" id="btn-limpar">Limpar</button>
                
            </form>

            <div id="resultado">
             
            </div>
        </section>
    </main>
</body>
